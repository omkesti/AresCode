[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arescode"
version = "0.0.1"
description = "A Claude Code-style terminal coding agent powered by local models via Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Om" }]
keywords = ["llm", "agent", "cli", "ollama", "coding-assistant"]
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
arescode = "arescode.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arescode"]

# The versioned system prompt lives at the repo root (prompts/system.md) but must ship *inside* the
# installed package so an installed AresCode (pipx/wheel) can still find it — otherwise it silently
# falls back to the minimal prompt and loses the whole action protocol. Bundle it beside the package
# as arescode/prompts/system.md; core/context.py looks there first, then the source-tree location.
[tool.hatch.build.targets.wheel.force-include]
"prompts/system.md" = "arescode/prompts/system.md"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# The parser corpus keeps one malformed sample per line on purpose; width is intentional.
"tests/test_parser.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --ignore=tests/fixtures"
asyncio_mode = "auto"
